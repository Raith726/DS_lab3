<!DOCTYPE html>

<html
    lang="es"
    xmlns:th="http://www.thymeleaf.org"
>

<head>

    <meta charset="UTF-8">

    <title>
        Detalle del usuario
    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>

<body>

<div class="container py-5">

    <div class="card shadow">

        <div class="card-body">

            <h1 th:text="${usuario.nombre}"></h1>

            <hr>

            <p>
                <strong>Codigo:</strong>
                <span th:text="${usuario.id}"></span>
            </p>

            <p>
                <strong>Email:</strong>
                <span th:text="${usuario.email}"></span>
            </p>

            <p>
                <strong>Rol:</strong>
                <span th:text="${usuario.rol}"></span>
            </p>

            <p>
                <strong>Username:</strong>
                <span th:text="${usuario.username}"></span>
            </p>

            <a
                class="btn btn-secondary"
                th:href="@{/usuarios}"
            >
                Regresar
            </a>

            <a
                class="btn btn-warning"
                th:href="@{/usuarios/{id}/editar(id=${usuario.id})}"
            >
                Editar
            </a>

        </div>

    </div>

</div>

</body>

</html>
