<!DOCTYPE html>

<html
    lang="es"
    xmlns:th="http://www.thymeleaf.org"
>

<head>

    <meta charset="UTF-8">

    <title>Usuarios</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>

<body>

<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a
            class="navbar-brand"
            th:href="@{/admin}"
        >
            Panel de administracion
        </a>

    </div>

</nav>


<div class="container py-5">

    <div
        class="d-flex
               justify-content-between
               align-items-center
               mb-4"
    >

        <h1>Usuarios</h1>

        <a
            class="btn btn-primary"
            th:href="@{/usuarios/nuevo}"
        >
            Nuevo usuario
        </a>

    </div>


    <table class="table table-striped table-hover">

        <thead>

        <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Email</th>
            <th>Rol</th>
            <th>Username</th>
            <th>Acciones</th>
        </tr>

        </thead>

        <tbody>

        <tr th:each="usuario : ${usuarios}">

            <td th:text="${usuario.id}"></td>

            <td th:text="${usuario.nombre}"></td>

            <td th:text="${usuario.email}"></td>

            <td>

                <span
                    class="badge"
                    th:classappend="${usuario.rol == 'admin'}
                        ? 'text-bg-success'
                        : 'text-bg-secondary'"
                    th:text="${usuario.rol}"
                >
                </span>

            </td>

            <td th:text="${usuario.username}"></td>

            <td>

                <a
                    class="btn btn-info btn-sm"
                    th:href="@{/usuarios/{id}(id=${usuario.id})}"
                >
                    Ver
                </a>

                <a
                    class="btn btn-warning btn-sm"
                    th:href="@{/usuarios/{id}/editar(id=${usuario.id})}"
                >
                    Editar
                </a>

                <form
                    th:action="@{/usuarios/{id}/eliminar(id=${usuario.id})}"
                    method="post"
                    style="display:inline"
                >

                    <button
                        type="submit"
                        class="btn btn-danger btn-sm"
                        onclick="return confirm('¿Desea eliminar el usuario?')"
                    >
                        Eliminar
                    </button>

                </form>

            </td>

        </tr>

        </tbody>

    </table>


    <div
        th:if="${#lists.isEmpty(usuarios)}"
        class="alert alert-info"
    >
        No existen usuarios registrados.
    </div>

</div>

</body>

</html>
