<!DOCTYPE html>

<html
    lang="es"
    xmlns:th="http://www.thymeleaf.org"
>

<head>

    <meta charset="UTF-8">

    <title>Usuario</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>

<body>

<div class="container py-5">

    <h1
        th:text="${usuario.id == null}
        ? 'Nuevo usuario'
        : 'Editar usuario'"
    ></h1>


    <div
        th:if="${error}"
        class="alert alert-danger"
        th:text="${error}"
    >
    </div>


    <form
        th:object="${usuario}"
        th:action="${usuario.id == null}
            ? @{/usuarios}
            : @{/usuarios/{id}(id=${usuario.id})}"
        method="post"
    >

        <div class="mb-3">

            <label class="form-label">
                Nombre
            </label>

            <input
                type="text"
                class="form-control"
                th:field="*{nombre}"
                required
            >

        </div>


        <div class="mb-3">

            <label class="form-label">
                Email
            </label>

            <input
                type="email"
                class="form-control"
                th:field="*{email}"
                required
            >

        </div>


        <div class="mb-3">

            <label class="form-label">
                Rol
            </label>

            <select
                class="form-select"
                th:field="*{rol}"
                required
            >
                <option value="admin">admin</option>
                <option value="usuario">usuario</option>
            </select>

        </div>


        <div class="mb-3">

            <label class="form-label">
                Username
            </label>

            <input
                type="text"
                class="form-control"
                th:field="*{username}"
                required
            >

        </div>


        <div class="mb-3">

            <label class="form-label">
                Contrasena
            </label>

            <input
                type="password"
                class="form-control"
                th:field="*{password}"
                required
            >

        </div>


        <button
            type="submit"
            class="btn btn-success"
        >
            Guardar
        </button>

        <a
            class="btn btn-secondary"
            th:href="@{/usuarios}"
        >
            Cancelar
        </a>

    </form>

</div>

</body>

</html>
