<!DOCTYPE html>

<html
    lang="es"
    xmlns:th="http://www.thymeleaf.org"
>

<head>

    <meta charset="UTF-8">

    <title>Iniciar sesion</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>

<body>

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-4">

            <h1 class="mb-4 text-center">
                Iniciar sesion
            </h1>

            <div
                th:if="${error}"
                class="alert alert-danger"
                th:text="${error}"
            >
            </div>

            <form
                th:action="@{/login}"
                method="post"
            >

                <div class="mb-3">

                    <label class="form-label">
                        Usuario
                    </label>

                    <input
                        type="text"
                        name="username"
                        class="form-control"
                        required
                    >

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Contrasena
                    </label>

                    <input
                        type="password"
                        name="password"
                        class="form-control"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="btn btn-primary w-100"
                >
                    Ingresar
                </button>

            </form>

        </div>

    </div>

</div>

</body>

</html>
